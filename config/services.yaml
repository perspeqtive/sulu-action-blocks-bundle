services:

    PERSPEQTIVE\SuluActionBlockBundle\Repository\ActionBlockRepository:
        arguments:
            $registry: '@doctrine'

    PERSPEQTIVE\SuluActionBlockBundle\Admin\ActionBlockAdmin:
        arguments:
            $viewBuilderFactory: '@sulu_admin.view_builder_factory'
            $securityChecker: '@sulu_security.security_checker'
        tags:
            - { name: sulu.admin }

    PERSPEQTIVE\SuluActionBlockBundle\Controller\Admin\ActionBlockController:
        class: PERSPEQTIVE\SuluActionBlockBundle\Controller\Admin\ActionBlockController
        arguments:
            $viewHandler: '@fos_rest.view_handler'
            $listRestHelper: '@sulu_core.list_rest_helper'
            $listBuilderFactory: '@sulu_core.doctrine_list_builder_factory'
            $fieldDescriptorFactory: '@sulu_core.list_builder.field_descriptor_factory'
            $restHelper: '@sulu_core.rest_helper'
            $actionBlockRepository: '@PERSPEQTIVE\SuluActionBlockBundle\Repository\ActionBlockRepository'
            $entityManager: '@doctrine.orm.entity_manager'
        tags:
            - { name: controller.service_arguments }

    PERSPEQTIVE\SuluActionBlockBundle\Registry\ActionRegistry:
        class: PERSPEQTIVE\SuluActionBlockBundle\Registry\ActionRegistry
        arguments:
            $actions: !tagged_iterator perspeqtive.sulu_action_block.action

    PERSPEQTIVE\SuluActionBlockBundle\Content\Select\ActionSelect:
        class: PERSPEQTIVE\SuluActionBlockBundle\Content\Select\ActionSelect
        public: true
        arguments:
            $actionRegistry: '@PERSPEQTIVE\SuluActionBlockBundle\Registry\ActionRegistry'

    PERSPEQTIVE\SuluActionBlockBundle\Content\Select\ActionBlockSelect:
        class: PERSPEQTIVE\SuluActionBlockBundle\Content\Select\ActionBlockSelect
        public: true
        arguments:
            $actionBlockRepository: '@PERSPEQTIVE\SuluActionBlockBundle\Repository\ActionBlockRepository'

