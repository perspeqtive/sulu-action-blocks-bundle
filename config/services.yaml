# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
services:

    PERSPEQTIVE\SuluActionBlocksBundle\Registry\ActionRegistry:
        class: PERSPEQTIVE\SuluActionBlocksBundle\Registry\ActionRegistry
        arguments:
            $actions: !tagged_iterator perspeqtive.sulu_action_block.action

    PERSPEQTIVE\SuluActionBlocksBundle\Twig\RenderActionBlockExtension:
        class: PERSPEQTIVE\SuluActionBlocksBundle\Twig\RenderActionBlockExtension
        arguments:
            $executor: '@PERSPEQTIVE\SuluActionBlocksBundle\Execution\ActionBlockExecutor'
        tags: ['twig.extension']

    PERSPEQTIVE\SuluActionBlocksBundle\Twig\RenderActionBlocksExtension:
        class: PERSPEQTIVE\SuluActionBlocksBundle\Twig\RenderActionBlocksExtension
        arguments:
            $executor: '@PERSPEQTIVE\SuluActionBlocksBundle\Execution\ActionBlockExecutor'
        tags: ['twig.extension']

    PERSPEQTIVE\SuluActionBlocksBundle\Execution\ActionBlockExecutor:
        class: PERSPEQTIVE\SuluActionBlocksBundle\Execution\ActionBlockExecutor
        arguments:
            $actionBlockInformationProvider: '@PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationBuilder'
            $actionRegistry: '@PERSPEQTIVE\SuluActionBlocksBundle\Registry\ActionRegistry'
            $eventDispatcher: '@event_dispatcher'
            $logger: '@monolog.logger.action_block'
            $environment: '%kernel.environment%'

    PERSPEQTIVE\SuluActionBlocksBundle\EventSubscriber\ActionBlockRedirectSubscriber:
        class: PERSPEQTIVE\SuluActionBlocksBundle\EventSubscriber\ActionBlockRedirectSubscriber
        arguments:
            $requestStack: '@request_stack'
        tags:
            - { name: kernel.event_subscriber }


    PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationCacheBuilder:
        class: PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationCacheBuilder
        arguments:
            $actionBlockInformationBuilder: '@PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationBuilder'
            $cacheFileWriter: '@PERSPEQTIVE\SuluActionBlocksBundle\Cache\FileWriter'

    PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationBuilder:
        class: PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationBuilder
        arguments:
            $actionRegistry: '@PERSPEQTIVE\SuluActionBlocksBundle\Registry\ActionRegistry'
            $slugger: '@slugger'

    PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationProvider:
        class: PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationProvider
        factory: ['@PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationProviderFactory', 'create']

    PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationProviderFactory:
        class: PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationProviderFactory
        arguments:
            $cacheFilePath: '%kernel.cache_dir%%perspeqtive_sulu_action_blocks_cache_path%'

    PERSPEQTIVE\SuluActionBlocksBundle\Structure\ActionBlocks\ActionBlockTemplateGenerator:
        class: PERSPEQTIVE\SuluActionBlocksBundle\Structure\ActionBlocks\ActionBlockTemplateGenerator
        arguments:
            $templatesPath: '%perspeqtive_sulu_action_blocks_templates_path%'
            $actionBlockInformationProvider: '@PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationBuilder'

    PERSPEQTIVE\SuluActionBlocksBundle\Structure\ActionBlocks\ActionBlocksBuilder:
        class: PERSPEQTIVE\SuluActionBlocksBundle\Structure\ActionBlocks\ActionBlocksBuilder
        arguments:
            $templateGenerator: '@PERSPEQTIVE\SuluActionBlocksBundle\Structure\ActionBlocks\ActionBlockTemplateGenerator'
            $fileWriter: '@PERSPEQTIVE\SuluActionBlocksBundle\Cache\FileWriter'

    PERSPEQTIVE\SuluActionBlocksBundle\Structure\EmptyActionBlocks\EmptyActionBlocksBuilder:
        class: PERSPEQTIVE\SuluActionBlocksBundle\Structure\EmptyActionBlocks\EmptyActionBlocksBuilder
        arguments:
            $actionBlockInformationProvider: '@PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationBuilder'
            $emptyActionBlockTemplateGenerator: '@PERSPEQTIVE\SuluActionBlocksBundle\Structure\EmptyActionBlocks\EmptyActionBlockTemplateGenerator'
            $fileWriter: '@PERSPEQTIVE\SuluActionBlocksBundle\Cache\FileWriter'

    PERSPEQTIVE\SuluActionBlocksBundle\Structure\EmptyActionBlocks\EmptyActionBlockTemplateGenerator:
        class: PERSPEQTIVE\SuluActionBlocksBundle\Structure\EmptyActionBlocks\EmptyActionBlockTemplateGenerator
        arguments:
            $templatesPath: '%perspeqtive_sulu_action_blocks_templates_path%'

    PERSPEQTIVE\SuluActionBlocksBundle\Cache\FileWriter:
        class: PERSPEQTIVE\SuluActionBlocksBundle\Cache\FileWriter
        arguments:
            $cacheSubDir: '%perspeqtive_sulu_action_blocks_cache_path%'

    PERSPEQTIVE\SuluActionBlocksBundle\Cache\ActionBlockCacheWarmer:
        class: PERSPEQTIVE\SuluActionBlocksBundle\Cache\ActionBlockCacheWarmer
        arguments:
            $actionBlocksBuilder: '@PERSPEQTIVE\SuluActionBlocksBundle\Structure\ActionBlocks\ActionBlocksBuilder'
            $emptyActionBlockTemplatesGenerator: '@PERSPEQTIVE\SuluActionBlocksBundle\Structure\EmptyActionBlocks\EmptyActionBlocksBuilder'
            $actionBlockInformationCacheBuilder: '@PERSPEQTIVE\SuluActionBlocksBundle\InformationMap\ActionBlockInformationCacheBuilder'
        tags:
            - { name: kernel.cache_warmer, priority: 999 }



